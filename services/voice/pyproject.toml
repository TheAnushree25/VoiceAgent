[project]
name = "voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheAnushree25", email = "theanushree25@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi[standard]>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
voice = "voice:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
